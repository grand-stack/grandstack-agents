name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  node:
    uses: grand-stack/.github/.github/workflows/ci-node.yml@v1
    with:
      scripts: "typecheck test build docs:check"
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t grandstack-agents-mcp:ci .
