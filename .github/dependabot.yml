# The ignores are pins that must hold (see AGENTS.md): graphql stays 16.x; @apollo/subgraph stays 2.14.4 (2.15.1 breaks @neo4j/graphql 7.6.4);
# the MCP SDK stays on the v1 API; the Node images stay on the current LTS line (24). Everything else arrives as a pull request that CI validates.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@modelcontextprotocol/sdk"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: "/"
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
