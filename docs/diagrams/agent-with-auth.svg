<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'><title id="t">With auth, the same agent tools run as a specific user: a token provider adds a fresh token, and the gateway decides what the role may do</title><desc id="d">The agent calls the MCP tools. The MCP server's token provider logs in to Keycloak, caches the token and sends it as an Authorization header to the gateway. The gateway checks the role's permissions: alice, a user, is refused a catalogue mutation; bob, an editor, is allowed.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect x="0.75" y="0.75" width="998.5" height="488.5" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="24" y="100" width="130" height="90" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="1.5"/>
<text x="89.0" y="122" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">agent</text>
<text x="89.0" y="142" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">same tools,</text>
<text x="89.0" y="158" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">no auth code</text>
<rect x="190" y="40" width="300" height="280" rx="8" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="340.0" y="62" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">MCP server</text>
<rect x="210" y="70" width="260" height="80" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="340.0" y="92" font-size="13" font-weight="650" text-anchor="middle" fill="#0f2233">run_query / run_mutation</text>
<text x="340.0" y="111.5" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">unchanged</text>
<rect x="210" y="200" width="260" height="90" rx="8" fill="#fff4d6" stroke="#9a6700" stroke-width="2.6"/>
<text x="340.0" y="222" font-size="13" font-weight="650" text-anchor="middle" fill="#0f2233">token provider</text>
<text x="340.0" y="241.5" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">logs in, caches the token,</text>
<text x="340.0" y="257.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">renews before it expires</text>
<path d="M 154 130 L 210 110" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="100" y="92" font-size="11.5" font-weight="400" text-anchor="start" fill="#475569" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">MCP tool call</text>
<path d="M 340 200 L 340 150" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="352" y="180" font-size="12" font-weight="400" text-anchor="start" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">headers()</text>
<rect x="190" y="380" width="300" height="70" rx="8" fill="#e1f5ee" stroke="#0b8a6a" stroke-width="1.5"/>
<text x="340.0" y="402" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">keycloak</text>
<text x="340.0" y="421.5" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">password grant, demo user (development only)</text>
<path d="M 290 290 L 290 380" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="278" y="340" font-size="12" font-weight="400" text-anchor="end" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">login</text>
<path d="M 390 380 L 390 290" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="402" y="340" font-size="12" font-weight="400" text-anchor="start" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">token</text>
<rect x="570" y="70" width="190" height="100" rx="8" fill="#e1f5ee" stroke="#0b8a6a" stroke-width="2.6"/>
<text x="665.0" y="92" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">gateway  :4000</text>
<text x="665.0" y="112" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">validates the token,</text>
<text x="665.0" y="128" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">checks permissions</text>
<rect x="810" y="70" width="166" height="100" rx="8" fill="#e1f5ee" stroke="#0b8a6a" stroke-width="1.5"/>
<text x="893.0" y="92" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">server</text>
<text x="893.0" y="112" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">verifies again,</text>
<text x="893.0" y="128" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">row-level rules</text>
<path d="M 470 110 L 570 110" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="520" y="98" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Bearer token</text>
<path d="M 760 120 L 810 120" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="540" y="230" width="436" height="220" rx="8" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="758.0" y="252" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">who is calling decides</text>
<rect x="560" y="270" width="190" height="160" rx="8" fill="#fde8e6" stroke="#b42318" stroke-width="1.5"/>
<text x="655.0" y="292" font-size="13" font-weight="650" text-anchor="middle" fill="#0f2233">alice  (user)</text>
<text x="655.0" y="311.5" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">run_query: works</text>
<text x="655.0" y="327.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">createMovies: the</text>
<text x="655.0" y="342.5" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">gateway refuses, and</text>
<text x="655.0" y="358.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">the agent reads why</text>
<rect x="766" y="270" width="190" height="160" rx="8" fill="#e1f5ee" stroke="#0b8a6a" stroke-width="1.5"/>
<text x="861.0" y="292" font-size="13" font-weight="650" text-anchor="middle" fill="#0f2233">bob  (editor)</text>
<text x="861.0" y="311.5" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">run_query: works</text>
<text x="861.0" y="327.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">createMovies: passes</text>
<text x="861.0" y="342.5" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">the gateway and the</text>
<text x="861.0" y="358.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">server accepts it</text>
<path d="M 665 170 L 665 230" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<circle cx="210" cy="200" r="11" fill="#0a6190"/>
<text x="210" y="204.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<circle cx="570" cy="70" r="11" fill="#0a6190"/>
<text x="570" y="74.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<circle cx="560" cy="270" r="11" fill="#0a6190"/>
<text x="560" y="274.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<circle cx="766" cy="270" r="11" fill="#0a6190"/>
<text x="766" y="274.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<circle cx="190" cy="380" r="11" fill="#0a6190"/>
<text x="190" y="384.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
</svg>
